spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME:project-management-backend}

# ============================================================
# SERVER
# ============================================================
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}

# ============================================================
# DATABASE - POSTGRESQL
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pmt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

# ============================================================
# FILE UPLOADS
# ============================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# ============================================================
# JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=${JACKSON_WRITE_DATES_AS_TIMESTAMPS:false}

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:project-management-api}

# ============================================================
# AUTHENTICATION
# ============================================================
auth.refresh-expiration-days=${AUTH_REFRESH_EXPIRATION_DAYS:7}
auth.password-reset-expiration-minutes=${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:10}
auth.email-verification-expiration-hours=${AUTH_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}

# ============================================================
# CORS / FRONTEND
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.name=${APP_NAME:Project Management}

# ============================================================
# EMAIL
# ============================================================
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@projectmanagement.local}
app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:false}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ============================================================
# WEB PUSH
# ============================================================
app.notification.web-push.enabled=${APP_NOTIFICATION_WEB_PUSH_ENABLED:false}
app.notification.web-push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.notification.web-push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.notification.web-push.vapid-subject=${VAPID_SUBJECT:mailto:admin@projectmanagement.local}

# ============================================================
# SECURITY
# ============================================================
app.security.trust-forwarded-headers=${APP_SECURITY_TRUST_FORWARDED_HEADERS:false}

# ============================================================
# SCHEDULERS
# ============================================================
app.scheduler.reminder.fixed-delay-ms=${REMINDER_SCHEDULER_DELAY_MS:60000}
app.scheduler.overdue-ticket.fixed-delay-ms=${OVERDUE_TICKET_SCHEDULER_DELAY_MS:300000}

# ============================================================
# LOGGING
# ============================================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE_SQL:WARN}
