spring.application.name=project-management-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pmt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.generate-ddl=true


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ============================================================
# FILE UPLOADS
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ============================================================
# JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET:change-this-development-only-jwt-secret-to-a-long-random-value-before-deploying}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
