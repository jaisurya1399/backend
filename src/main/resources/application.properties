spring.application.name=project-management-backend

# ============================================================
# SERVER
# ============================================================

server.port=8080


# ============================================================
# DATABASE - POSTGRESQL
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/pmt
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration


# ============================================================
# FILE UPLOADS
# ============================================================

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB


# ============================================================
# JACKSON
# ============================================================

spring.jackson.serialization.write-dates-as-timestamps=false


# ============================================================
# JWT
# ============================================================

jwt.secret=cO4kzodmQxSHWfrdsiOC9GxnC3e5BV8+P8u+/IFcYhkZ8+2/yEoL9h3pHkSJCgdP5uECXEnFzLO11wDcEYJT4Q==
jwt.expiration=86400000
jwt.issuer=project-management-api


# ============================================================
# AUTHENTICATION
# ============================================================

auth.refresh-expiration-days=7
auth.password-reset-expiration-minutes=10
auth.email-verification-expiration-hours=24

auth.login.max-attempts=5
auth.login.window-minutes=15


# ============================================================
# CORS
# ============================================================

app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.frontend-url=http://localhost:5173


# ============================================================
# EMAIL
# ============================================================

app.mail.enabled=false
app.mail.from=no-reply@projectmanagement.local

app.notification.email.enabled=false


# ============================================================
# WEB PUSH
# ============================================================

app.notification.web-push.enabled=false

app.notification.web-push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.notification.web-push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.notification.web-push.vapid-subject=${VAPID_SUBJECT:mailto:admin@projectmanagement.local}


# ============================================================
# SECURITY
# ============================================================

app.security.trust-forwarded-headers=false


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN