spring.application.name=project-management-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pmt}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.generate-ddl=true


spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# FLYWAY
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# ============================================================
# FILE UPLOADS
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ============================================================
# JACKSON
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:project-management-api}
auth.refresh-expiration-days=${AUTH_REFRESH_EXPIRATION_DAYS:30}
auth.password-reset-expiration-minutes=${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:30}
auth.email-verification-expiration-hours=${AUTH_EMAIL_VERIFICATION_EXPIRATION_HOURS:24}
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.window-minutes=${AUTH_LOGIN_WINDOW_MINUTES:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@example.com}
app.notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
app.notification.web-push.enabled=${WEB_PUSH_ENABLED:false}
app.notification.web-push.vapid-public-key=${VAPID_PUBLIC_KEY:}
app.notification.web-push.vapid-private-key=${VAPID_PRIVATE_KEY:}
app.notification.web-push.vapid-subject=${VAPID_SUBJECT:mailto:admin@example.com}
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO
